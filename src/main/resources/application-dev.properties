# Dev profile - H2 file database (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/forge;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=validate

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=Zm9yZ2Utc2VjcmV0LWtleS1mb3ItZGV2LWVudmlyb25tZW50LW9ubHk=
jwt.expiration=86400000

# Cookies (http://localhost, not HTTPS)
app.cookies.secure=false

# Logging
logging.level.com.forge=DEBUG
logging.level.org.hibernate.SQL=DEBUG
