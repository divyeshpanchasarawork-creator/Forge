# Prod profile - PostgreSQL on Render
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.format_sql=false

# Server tuning (free tier: 0.1 vCPU / 512 MB)
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=20
server.tomcat.max-connections=40

# Connection pool (stay under free Postgres connection cap)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# Compression
server.compression.enabled=true
server.compression.min-response-size=1024

# Cold start optimization
spring.main.lazy-initialization=true

# CORS
cors.allowed-origins=https://forge-frontend-eight.vercel.app,https://forge-psi.vercel.app,https://forgecompanion.vercel.app

# JWT — must be set via env var in production
# jwt.secret (required, no default — app fails to start if missing)
jwt.expiration=1800000
jwt.refresh-expiration=604800000

# Disable Swagger/OpenAPI in prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.com.forge=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
