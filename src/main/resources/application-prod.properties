# Prod profile - PostgreSQL on Render
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Cold start optimization
spring.main.lazy-initialization=true

# CORS
cors.allowed-origins=https://forge-frontend-eight.vercel.app,https://forge-psi.vercel.app,https://forgecompanion.vercel.app

# JWT — must be set via env var in production
# jwt.secret (required, no default — app fails to start if missing)
jwt.expiration=1800000
jwt.refresh-expiration=604800000

# Disable Swagger/OpenAPI in prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.com.forge=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
