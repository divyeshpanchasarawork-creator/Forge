# Shared configuration
# No default profile: a missing/misspelled SPRING_PROFILES_ACTIVE must fail closed
# instead of silently running dev (known creds + dev JWT secret) in production.
spring.application.name=forge

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.default-property-inclusion=non_null

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.forge=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
