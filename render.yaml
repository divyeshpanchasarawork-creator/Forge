services:
  - type: web
    name: forge-api
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: DATABASE_URL
      - key: DATABASE_USERNAME
        fromDatabase:
          name: forge-db
          property: DATABASE_USERNAME
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: forge-db
          property: DATABASE_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"

  - type: postgresql
    name: forge-db
    plan: free
    databaseName: forge
    ipAllowList: []
