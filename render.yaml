services:
  - type: web
    name: forge-api
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: forge-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: forge-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: forge-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: forge-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: forge-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=64m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"

databases:
  - name: forge-db
    plan: free
    databaseName: forge
    ipAllowList: []
